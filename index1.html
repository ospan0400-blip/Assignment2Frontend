<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 2</title>
<link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="pagegrid">
    <header class="siteheader">
      <h1>Grid Layout</h1>
    </header>

    <div class="sidebar">
      <h2>Sidebar</h2>
      <ul>
        <li>Dashboard</li>
        <li>Projects</li>
        <li>Messages</li>
        <li>Settings</li>
      </ul>
    </div>

    <main class="sitemain">
      <h2>Main Content</h2>
      <p>This is the main content area, placed to the right of the sidebar using named grid areas.</p>
      <section class="gallerysection">
        <h2>Image Gallery</h2>
        <div class="gallery">
          <figure class="galleryitem">
            <img src="bridgeimage.jpg" alt="Gallery photo 1">
            <figcaption>Canyon Ridge</figcaption>
          </figure>
          <figure class="galleryitem">
            <img src="streetlightsimage.jpg" alt="Gallery photo 2">
            <figcaption>Harbor Lights</figcaption>
          </figure>
          <figure class="galleryitem">
            <img src="mountainsimage.jpg" alt="Gallery photo 3">
            <figcaption>Mountain Range</figcaption>
          </figure>
          <figure class="galleryitem">
            <img src="cityimage.jpg" alt="Gallery photo 4">
            <figcaption>City Skyscrapers</figcaption>
          </figure>
          <figure class="galleryitem">
            <img src="berriesimage.jpg" alt="Gallery photo 5">
            <figcaption>Berries</figcaption>
          </figure>
          <figure class="galleryitem">
            <img src="tulipimage.jpg" alt="Gallery photo 6">
            <figcaption>Spring Tulips</figcaption>
          </figure>
          <figure class="galleryitem">
            <img src="landscapeimage.jpg" alt="Gallery photo 7">
            <figcaption>Salt Flats</figcaption>
          </figure>
          <figure class="galleryitem">
            <img src="shoppingimage.jpg" alt="Gallery photo 8">
            <figcaption>Shopping Center</figcaption>
          </figure>
          <figure class="galleryitem">
            <img src="winterimage.jpg" alt="Gallery photo 9">
            <figcaption>Winter</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer class="sitefooter">
        Footer
    </footer>
  </div>

</body>
</html>
